<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MusicStream</title>
<style>
:root {
  --bg: #121212;
  --bg-elevated: #181818;
  --bg-highlight: #282828;
  --text: #ffffff;
  --text-sub: #b3b3b3;
  --accent: #1db954;
  --accent-hover: #1ed760;
  --border: #282828;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#app { display: flex; flex: 1; min-height: 0; overflow: hidden; }
#sidebar {
  width: 220px;
  background: #000;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
#genre-list { overflow-y: auto; min-height: 0; flex: 1; }
#sidebar h2 { font-size: 12px; margin: 16px 8px 8px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
.nav-item {
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-sub);
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 500;
  flex-shrink: 0;
}
#genre-list .nav-item { font-size: 13px; font-weight: 400; padding: 6px 12px; }
.nav-item:hover, .nav-item.active { background: var(--bg-highlight); color: var(--text); }
#main { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 150px; background: linear-gradient(180deg, #1a1a1a 0%, #121212 200px); }
.section-title { font-size: 24px; font-weight: 700; margin: 24px 0 16px; }
.playlist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 176px);
  gap: 16px;
  justify-content: start;
}
.carousel { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
.carousel::-webkit-scrollbar { height: 6px; }
.card {
  width: 176px;
  max-width: 176px;
  min-width: 0;
  flex: 0 0 176px;
  background: var(--bg-elevated);
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.card:hover { background: var(--bg-highlight); }
.card-img {
  width: 152px;
  height: 152px;
  background: #333;
  border-radius: 4px;
  margin-bottom: 12px;
  overflow: hidden;
}
.card-img img {
  width: 152px;
  height: 152px;
  object-fit: cover;
  display: block;
}
.row-art {
  width: 40px;
  height: 40px;
  object-fit: cover;
  border-radius: 4px;
  background: #333;
}
.dice-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 24px;
  padding: 12px 18px;
  font-weight: 700;
  cursor: pointer;
  margin: 4px 0 24px;
}
.card p { font-size: 13px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-list { width: 100%; }
.track-row {
  display: grid;
  grid-template-columns: 40px 1fr 180px 80px 40px;
  padding: 8px 12px;
  border-radius: 4px;
  align-items: center;
  cursor: pointer;
  font-size: 14px;
}
.track-row:hover { background: var(--bg-highlight); }
.track-row .title { font-weight: 500; }
.track-row .artist { color: var(--text-sub); font-size: 13px; }
#player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 118px;
  background: #181818;
  border-top: 1px solid #282828;
  display: grid;
  grid-template-columns: minmax(180px, 280px) auto minmax(240px, 1fr);
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  z-index: 100;
}
#now-playing { min-width: 0; }
#now-playing .title, #now-playing .artist {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#now-playing .title { font-weight: 600; font-size: 14px; }
#now-playing .artist { font-size: 12px; color: var(--text-sub); }
#controls { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
#transport { display: flex; align-items: center; justify-content: center; gap: 12px; }
#modes { display: flex; gap: 6px; }
.mode-btn {
  background: #2a2a2a;
  color: #fff;
  border: none;
  border-radius: 14px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
}
.mode-btn.active { background: var(--accent); color: #000; font-weight: 700; }
.ctrl-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ctrl-btn:hover { background: var(--bg-highlight); }
.ctrl-btn.play { background: var(--text); color: #000; font-size: 16px; }
#progress-container { min-width: 0; display: flex; align-items: center; gap: 8px; }
#volume-wrap { display: flex; align-items: center; gap: 6px; width: 110px; flex-shrink: 0; }
#volume-wrap span { font-size: 11px; color: var(--text-sub); }
#volume { width: 80px; accent-color: #1db954; }
#progress-bar {
  flex: 1;
  height: 4px;
  background: #4d4d4d;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}
#progress-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
#time { font-size: 11px; color: var(--text-sub); min-width: 40px; text-align: center; }
#upload-area {
  border: 2px dashed #444;
  border-radius: 8px;
  padding: 40px;
  text-align: center;
  margin: 20px 0;
  cursor: pointer;
}
#upload-area:hover { border-color: var(--accent); }
input[type="file"] { display: none; }
.search-bar {
  background: #242424;
  border: none;
  border-radius: 20px;
  padding: 10px 16px;
  color: white;
  width: 100%;
  max-width: 400px;
  margin-bottom: 20px;
  font-size: 14px;
}
@media (max-width: 768px) {
  #sidebar { display: none; }
  #main { padding: 12px 12px 110px; }
  .track-row { grid-template-columns: 32px 1fr 60px; }
  .track-row .album, .track-row .duration { display: none; }
  #player { height: auto; grid-template-columns: 1fr auto; padding: 8px 12px 10px; }
  #progress-container { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="nav-item active" data-page="Home" onclick="showHome()">Home</div>
    <div class="nav-item" data-page="Search" onclick="showSearch()">Search</div>
    <div class="nav-item" data-page="Library" onclick="showLibrary()">Library</div>
    <div class="nav-item" data-page="Presets" onclick="showPresets()">Presets & Server</div>
    <div class="nav-item" data-page="Upload" onclick="showUpload()">Upload Music</div>
    <h2>Categories</h2>
    <div id="genre-list"></div>
  </div>
  <div id="main">
    <div id="content"></div>
  </div>
</div>
<div id="player">
  <div id="now-playing">
    <div class="title">Nothing playing</div>
    <div class="artist">—</div>
  </div>
  <div id="controls">
    <div id="transport">
      <button class="ctrl-btn" onclick="prevTrack()">&#9664;</button>
      <button class="ctrl-btn play" id="play-btn" onclick="togglePlay()">&#9654;</button>
      <button class="ctrl-btn" onclick="nextTrack()">&#9654;&#9654;</button>
    </div>
    <div id="modes">
      <button type="button" class="mode-btn" data-mode="order" onclick="setMode('order')">In order</button>
      <button type="button" class="mode-btn" data-mode="shuffle" onclick="setMode('shuffle')">Shuffle</button>
      <button type="button" class="mode-btn" data-mode="recommend" onclick="setMode('recommend')">For you</button>
    </div>
  </div>
  <div id="progress-container">
    <span id="time-current">0:00</span>
    <div id="progress-bar" onclick="seek(event)">
      <div id="progress-fill"></div>
    </div>
    <span id="time-total">0:00</span>
    <label id="volume-wrap"><span>Vol</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  </div>
  <audio id="audio" preload="none"></audio>
</div>

<script>
const API = '';
let currentTrack = null;
let queue = [];
let sourceTracks = [];
let loadedTracks = [];
let queueIndex = -1;
let playMode = 'shuffle';
let activeTrack = null;
let loggedListen = false;
let isPlaying = false;
const audio = document.getElementById('audio');
const volume = document.getElementById('volume');
audio.volume = Number(localStorage.getItem('volume') || 0.8);
volume.value = String(audio.volume);
volume.addEventListener('input', () => {
  audio.volume = Number(volume.value);
  localStorage.setItem('volume', volume.value);
});

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

async function showHome() {
  setActive('Home');
  const data = await fetchJSON('/api/recommendations');
  let html = `<h1 class="section-title">Made for you</h1><div class="carousel">`;
  data.for_you.slice(0, 10).forEach(t => {
    html += cardHTML(t);
  });
  html += `</div><h1 class="section-title">Recently Added</h1><div class="carousel">`;
  data.recently_added.forEach(t => {
    html += cardHTML(t);
  });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
  loadGenres();
}

function coverURL(artist, title) {
  return `/api/cover?artist=${encodeURIComponent(artist || '')}&title=${encodeURIComponent(title || '')}`;
}

function attr(value) {
  return String(value || '').replace(/&/g, '&').replace(/"/g, '"').replace(/</g, '<');
}

function cardHTML(t) {
  return `<div class="card" data-play-title="${attr(t.title)}" data-play-artist="${attr(t.artist)}">
    <div class="card-img"><img alt="" src="${coverURL(t.artist, t.title)}" onerror="this.style.display='none'"></div>
    <h3>${attr(t.title)}</h3>
    <p>${attr(t.artist)}</p>
  </div>`;
}

function escape(s) { return (s||'').replace(/'/g, "\\'"); }

async function showSearch() {
  setActive('Search');
  document.getElementById('content').innerHTML = `
    <input class="search-bar" placeholder="Search. A song that is not downloaded runs the recorded steps." oninput="doSearch(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault(); commitSearch(this.value)}">
    <div id="search-results"></div>
  `;
}

let searchTimer = null;

async function doSearch(q) {
  if (q.length < 2) return;
  const tracks = await fetchJSON(`/api/search?q=${encodeURIComponent(q)}`);
  let html = `<div class="track-list">`;
  tracks.forEach((t, i) => {
    html += trackRow(t, i);
  });
  html += `</div>`;
  document.getElementById('search-results').innerHTML = html || '<p>Not downloaded. The laptop will run the recorded steps.</p>';
  clearTimeout(searchTimer);
  const query = q.trim();
  if (!tracks.length && query.length >= 3) {
    searchTimer = setTimeout(() => downloadMissing(query, ''), 1000);
  }
}

function trackRow(t, idx) {
  return `<div class="track-row" onclick="playTrack(${t.id}, '${escape(t.title)}', '${escape(t.artist)}')">
    <span>${idx+1}</span>
    <div><div class="title">${t.title}</div><div class="artist">${t.artist}</div></div>
    <div class="album">${t.album || ''}</div>
    <div class="duration">${formatTime(t.duration)}</div>
    <span>▶</span>
  </div>`;
}

async function showLibrary() {
  setActive('Library');
  const tracks = await fetchJSON('/api/tracks?limit=200');
  let html = `<h1 class="section-title">Your Library</h1><div class="track-list">`;
  tracks.forEach((t, i) => { html += trackRow(t, i); });
  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

async function loadGenres() {
  const genres = await fetchJSON('/api/categories').catch(() => []);
  const el = document.getElementById('genre-list');
  el.innerHTML = genres.filter(genre => genre.count > 0).map(genre =>
    `<div class="nav-item" onclick="showGenre('${escape(genre.name)}')">${attr(genre.name)}</div>`
  ).join('');
}

async function showGenre(genre) {
  setActive('');
  const data = await fetchJSON('/api/category/' + encodeURIComponent(genre));
  loadedTracks = dedupeTracks(data.tracks || []);
  let html = `<h1 class="section-title">${attr(genre)}</h1><div class="track-list">`;
  loadedTracks.forEach(track => { html += playlistRow(track); });
  html += '</div>';
  document.getElementById('content').innerHTML = html || '<p>Nothing in this category.</p>';
}

async function showPresets() {
  setActive('Presets');
  const browser = await fetchJSON('/api/media-browser').catch(() => ({ url: '', steps: [] }));
  const lines = (browser.steps || []).map(step => `Step ${step.step}: ${step.action}`).join('\n') || 'No steps yet';
  document.getElementById('content').innerHTML = `<h1 class="section-title">Media server</h1>
    <p style="color:var(--text-sub);margin-bottom:16px">Opens a normal Chrome tab and uses the real mouse and keyboard. Each click becomes the next step. The first place you type is remembered as the search bar. Keep the Chrome window in the same place, because the steps are screen positions.</p>
    <input class="search-bar" id="media-url" placeholder="Media server address" value="${attr(browser.url || '')}">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <button class="dice-btn" onclick="openMediaBrowser()">Open media browser</button>
      <button class="dice-btn" onclick="stopRecording()">Stop</button>
      <button class="dice-btn" onclick="clearRecording()">Clear</button>
    </div>
    <pre id="media-status" style="color:var(--text-sub);white-space:pre-wrap">${attr(lines)}</pre>`;
  if (browser.recording) pollMediaSteps();
}

async function openMediaBrowser() {
  const field = document.getElementById('media-url');
  const url = field ? field.value.trim() : '';
  const status = document.getElementById('media-status');
  if (status) status.textContent = 'Opening a normal Chrome tab. Click through the site. The first place you type becomes the search bar.';
  const response = await fetch('/api/media-browser/open?address=' + encodeURIComponent(url), { method: 'POST' });
  const data = await response.json();
  if (!data.ok) {
    alert(data.detail || data.error || 'Could not open Chrome');
    return;
  }
  pollMediaSteps();
}

async function pollMediaSteps() {
  const status = document.getElementById('media-status');
  if (!status) return;
  const data = await fetchJSON('/api/media-browser').catch(() => null);
  if (!data) return;
  status.textContent = (data.steps || []).map(step => `Step ${step.step}: ${step.action}`).join('\n') || 'No steps yet';
  if (data.recording) setTimeout(pollMediaSteps, 700);
}

async function stopRecording() {
  await fetch('/api/media-browser/stop', { method: 'POST' });
  pollMediaSteps();
}

async function clearRecording() {
  await fetch('/api/media-browser/clear', { method: 'POST' });
  const status = document.getElementById('media-status');
  if (status) status.textContent = 'No steps yet';
}

async function fetchQuery(query) {
  const box = document.getElementById('search-results');
  if (box) box.insertAdjacentHTML('afterbegin', '<p id="fetch-note">Looking this up on the media server...</p>');
  const response = await fetch('/api/media-browser/fetch?query=' + encodeURIComponent(query), { method: 'POST' });
  const data = await response.json();
  const note = document.getElementById('fetch-note');
  const message = data.ok ? ('Added ' + data.saved) : (data.detail || data.error || 'The download did not finish');
  if (note) note.textContent = message;
  else alert(message);
}

let recordedSteps = [];

async function recordBrowserClick() {
  const box = document.getElementById('browser-draft');
  if (box) box.textContent = 'Click the control inside the media Chrome window.';
  const response = await fetch('/api/media-browser/sequence/click', { method: 'POST' });
  const data = await response.json();
  if (box) box.textContent = data.ok ? JSON.stringify(data.draft, null, 2) : (data.detail || 'Click was not recorded');
}

async function addBrowserType() {
  const text = prompt('Text to type. {query}, {title}, and {artist} are filled in later.', '{query}');
  if (!text) return;
  const response = await fetch('/api/media-browser/sequence/step?action=type&text=' + encodeURIComponent(text), { method: 'POST' });
  const data = await response.json();
  const box = document.getElementById('browser-draft');
  if (box) box.textContent = data.ok ? JSON.stringify(data.draft, null, 2) : (data.detail || 'Text was not added');
}

async function addBrowserKey() {
  const key = prompt('Key name, such as Enter, Tab, or Escape', 'Enter');
  if (!key) return;
  const response = await fetch('/api/media-browser/sequence/step?action=key&key=' + encodeURIComponent(key), { method: 'POST' });
  const data = await response.json();
  const box = document.getElementById('browser-draft');
  if (box) box.textContent = data.ok ? JSON.stringify(data.draft, null, 2) : (data.detail || 'Key was not added');
}

async function saveBrowserSequence() {
  const name = document.getElementById('browser-seq-name').value;
  const response = await fetch('/api/media-browser/sequence/save?name=' + encodeURIComponent(name), { method: 'POST' });
  const data = await response.json();
  alert(data.ok ? ('Saved ' + data.saved) : (data.detail || 'Sequence was not saved'));
  if (data.ok) showPresets();
}

async function startRecording() {
  const label = prompt("Label for this click position (e.g. search_box):") || "position";
  document.getElementById('recorded-steps').textContent = "Move mouse to target in 3 seconds...";
  const res = await fetch(`/api/automation/record-position?label=${encodeURIComponent(label)}`);
  const data = await res.json();
  recordedSteps.push({action: "click", x: data.x, y: data.y});
  document.getElementById('recorded-steps').textContent = JSON.stringify(recordedSteps, null, 2);
}

async function saveSequence() {
  const name = document.getElementById('seq-name').value;
  if (!name || recordedSteps.length === 0) return alert("Name and at least one step required");
  // Add a type_query step at the end if not present
  if (!recordedSteps.some(s => s.action === "type_query")) {
    recordedSteps.push({action: "type_query"});
    recordedSteps.push({action: "hotkey", keys: ["enter"]});
  }
  await fetch("/api/automation/sequence", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, steps: recordedSteps})
  });
  recordedSteps = [];
  showPresets();
}

async function runSequence(name) {
  await fetch(`/api/automation/run?name=${encodeURIComponent(name)}`, {method: "POST"});
  alert("Sequence started. Keep media server in foreground.");
}

async function runWithQueryAndValidate() {
  const name = document.getElementById('auto-sequence').value;
  const query = document.getElementById('auto-query').value;
  const title = document.getElementById('expected-title').value;
  const artist = document.getElementById('expected-artist').value;
  const duration = document.getElementById('expected-duration').value;
  const delay = document.getElementById('extra-delay').value || 1.5;
  if (!name || !query) return alert("Sequence and search term required");
  
  document.getElementById('validation-result').textContent = "Running automation and waiting for download...";
  const params = new URLSearchParams({
    sequence: name,
    query: query,
    extra_delay: delay,
  });
  if (title) params.append("expected_title", title);
  if (artist) params.append("expected_artist", artist);
  if (duration) params.append("expected_duration", duration);
  
  const res = await fetch(`/api/query-and-validate?${params}`, {method: "POST"});
  const data = await res.json();
  document.getElementById('validation-result').textContent = JSON.stringify(data, null, 2);
}

async function savePreset() {
  const name = document.getElementById('preset-name').value;
  const query = document.getElementById('preset-query').value;
  if (!name || !query) return;
  await fetch(`/api/presets?name=${encodeURIComponent(name)}&query=${encodeURIComponent(query)}`, {method:'POST'});
  showPresets();
}

function setActive(name) {
  document.querySelectorAll('#sidebar .nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === name);
  });
}

function showUpload() {
  setActive('Upload');
  document.getElementById('content').innerHTML = `
    <h1 class="section-title">Upload Music</h1>
    <div id="upload-area" onclick="document.getElementById('file-input').click()">
      <p>Click here to upload audio files (MP3, FLAC, OPUS, and more)</p>
      <input type="file" id="file-input" multiple accept="audio/*" onchange="uploadFiles(this.files)">
    </div>
    <p id="upload-status"></p>
  `;
}

async function uploadFiles(files) {
  const form = new FormData();
  for (const file of files) form.append('files', file);
  document.getElementById('upload-status').textContent = 'Uploading...';
  const response = await fetch('/api/upload', { method: 'POST', body: form });
  const data = await response.json();
  document.getElementById('upload-status').textContent = `Uploaded ${data.count} tracks.`;
  setTimeout(() => showHome(), 800);
}

async function playTrack(id, title, artist, allowDownload = true) {
  currentTrack = { id, title, artist };
  document.querySelector('#now-playing .title').textContent = title;
  document.querySelector('#now-playing .artist').textContent = artist;
  audio.src = `/api/stream/${id}`;
  try {
    await audio.play();
    document.getElementById('play-btn').textContent = '\u23F8';
    await fetch(`/api/play/${id}`, { method: 'POST' });
  } catch (err) {
    const missing = await downloadMissing(title, artist);
    if (!missing) document.querySelector('#now-playing .artist').textContent = 'This song is not downloaded, and the recorded steps did not finish';
  }
}

function togglePlay() {
  if (!currentTrack) return;
  if (audio.paused) {
    audio.play();
    document.getElementById('play-btn').textContent = '\u23F8';
    sendControl('play');
  } else {
    audio.pause();
    document.getElementById('play-btn').textContent = '\u25B6';
    sendControl('pause');
  }
}

audio.ontimeupdate = () => {
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('time-current').textContent = formatTime(audio.currentTime);
  document.getElementById('time-total').textContent = formatTime(audio.duration);
  if (!loggedListen && audio.currentTime >= 30) {
    loggedListen = true;
    remember(activeTrack, 'play');
  }
};

audio.onended = () => advance(false);

function seek(e) {
  const bar = document.getElementById('progress-bar');
  const rect = bar.getBoundingClientRect();
  if (!audio.duration) return;
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
}

function nextTrack() { advance(true); }
function prevTrack() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  if (!queue.length) return;
  queueIndex = (queueIndex - 1 + queue.length) % queue.length;
  playQueueIndex();
}

let ws;
function connectControls() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/controls`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type !== 'control') return;
    if (msg.action === 'play') audio.play();
    if (msg.action === 'pause') audio.pause();
    if (msg.action === 'seek' && msg.payload) audio.currentTime = msg.payload.time;
  };
}
connectControls();

function sendControl(action, payload = {}) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({action, payload}));
}

async function playByName(title, artist, track) {
  activeTrack = track || { title, artist, genres: '', album: '' };
  loggedListen = false;
  document.querySelector('#now-playing .title').textContent = title || 'Unknown';
  document.querySelector('#now-playing .artist').textContent = 'Looking for audio...';
  const match = await fetchJSON(`/api/match?title=${encodeURIComponent(title || '')}&artist=${encodeURIComponent(artist || '')}`);
  if (match.found) {
    await playTrack(match.id, match.title, match.artist);
    return true;
  }
  const downloaded = await downloadMissing(title, artist);
  if (downloaded) return true;
  if (match.preview) {
    currentTrack = { title, artist, preview: true };
    audio.src = match.preview;
    document.querySelector('#now-playing .artist').textContent = (artist || 'Unknown') + ' · 30 second preview';
    try {
      await audio.play();
      document.getElementById('play-btn').textContent = '\u23F8';
      return true;
    } catch (err) {
      return false;
    }
  }
  document.querySelector('#now-playing .artist').textContent = 'No audio file for this song yet';
  return false;
}

let mediaJob = null;

async function downloadMissing(title, artist) {
  const query = [artist, title].filter(Boolean).join(' ').trim();
  if (!query) return false;
  if (!mediaJob) {
    document.querySelector('#now-playing .artist').textContent = 'Not downloaded. Running the recorded steps on the laptop...';
    const params = new URLSearchParams({ query, title: title || '', artist: artist || '' });
    mediaJob = fetch('/api/media-browser/fetch?' + params.toString(), { method: 'POST' })
      .then(response => response.json())
      .finally(() => { mediaJob = null; });
  }
  const data = await mediaJob;
  if (!data.ok) {
    document.querySelector('#now-playing .artist').textContent = data.detail || data.error || 'The media server steps did not finish';
    return false;
  }
  const again = await fetchJSON(`/api/match?title=${encodeURIComponent(title || query)}&artist=${encodeURIComponent(artist || '')}`);
  if (!again.found) {
    document.querySelector('#now-playing .artist').textContent = 'Downloaded, but it did not match this song';
    return false;
  }
  await playTrack(again.id, again.title, again.artist, false);
  return true;
}

async function commitSearch(q) {
  const query = (q || '').trim();
  if (query.length < 2) return;
  const tracks = await fetchJSON(`/api/search?q=${encodeURIComponent(query)}`);
  const exact = (tracks || []).find(track => (track.title || '').toLowerCase() === query.toLowerCase());
  if (exact) {
    playTrack(exact.id, exact.title, exact.artist);
    return;
  }
  await downloadMissing(query, '');
  doSearch(query);
}

function dedupeTracks(tracks) {
  const seen = new Set();
  const cleaned = [];
  for (const track of tracks || []) {
    const key = `${(track.title || '').trim().toLowerCase()}|${(track.artist || '').split(';')[0].trim().toLowerCase()}`;
    if (!track.title || seen.has(key)) continue;
    seen.add(key);
    cleaned.push(track);
  }
  return cleaned;
}

function sameSong(a, b) {
  if (!a || !b) return false;
  const artist = value => (value.artist || '').split(';')[0].trim().toLowerCase();
  return (a.title || '').trim().toLowerCase() === (b.title || '').trim().toLowerCase() && artist(a) === artist(b);
}

function sameArtist(a, b) {
  const left = (a.artist || '').split(';')[0].trim().toLowerCase();
  const right = (b.artist || '').split(';')[0].trim().toLowerCase();
  return left && right && (left === right || left.includes(right) || right.includes(left));
}

function sameGenre(a, b) {
  const genres = value => (value.genres || value.genre || '').toLowerCase().split(',').map(item => item.trim()).filter(Boolean);
  const left = genres(a);
  return left.some(genre => genres(b).includes(genre));
}

function shuffleTracks(tracks) {
  const copy = tracks.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function setMode(mode) {
  playMode = mode;
  document.querySelectorAll('.mode-btn').forEach(button => {
    button.classList.toggle('active', button.dataset.mode === mode);
  });
  if (!sourceTracks.length) return;
  const current = queue[queueIndex];
  queue = mode === 'shuffle' ? shuffleTracks(sourceTracks) : sourceTracks.slice();
  queueIndex = Math.max(0, queue.findIndex(track => sameSong(track, current)));
}

async function remember(track, kind) {
  if (!track || !track.title) return;
  const params = new URLSearchParams({
    title: track.title,
    artist: track.artist || '',
    genres: track.genres || track.genre || '',
    album: track.album || '',
    kind,
  });
  await fetch('/api/listening?' + params.toString(), { method: 'POST' }).catch(() => {});
}

async function recommendIndex(current) {
  const history = await fetchJSON('/api/listening?minutes=30').catch(() => ({ plays: [], skips: [] }));
  const choices = queue.map((track, index) => {
    if (index === queueIndex || sameSong(track, current)) return { index, score: 0 };
    let score = 1;
    if (sameArtist(track, current)) score += 4;
    if (sameGenre(track, current)) score += 3;
    if (track.album && track.album === current.album) score += 2;
    for (const play of history.plays || []) {
      if (sameArtist(track, play)) score += 3;
      if (sameGenre(track, play)) score += 2;
    }
    for (const skip of history.skips || []) {
      if (sameSong(track, skip)) score -= 8;
      else if (sameArtist(track, skip)) score -= 4;
      else if (sameGenre(track, skip)) score -= 2;
    }
    return { index, score: Math.max(score, 0) };
  }).filter(choice => choice.score > 0);
  if (!choices.length) return (queueIndex + 1) % queue.length;
  const total = choices.reduce((sum, choice) => sum + choice.score, 0);
  let roll = Math.random() * total;
  for (const choice of choices) {
    roll -= choice.score;
    if (roll <= 0) return choice.index;
  }
  return choices[choices.length - 1].index;
}

async function playQueueIndex() {
  const track = queue[queueIndex];
  if (!track) return;
  const started = await playByName(track.title, track.artist, track);
  if (!started) setTimeout(() => advance(false), 600);
}

async function startPlaylist(tracks, startIndex) {
  sourceTracks = dedupeTracks(tracks);
  if (!sourceTracks.length) return;
  const current = sourceTracks[Math.max(0, Math.min(startIndex, sourceTracks.length - 1))];
  queue = playMode === 'shuffle' ? shuffleTracks(sourceTracks) : sourceTracks.slice();
  queueIndex = Math.max(0, queue.findIndex(track => sameSong(track, current)));
  await playQueueIndex();
}

async function advance(skipped) {
  const current = activeTrack;
  if (current) {
    if (skipped && !loggedListen) await remember(current, 'skip');
    else if (!loggedListen) await remember(current, 'play');
  }
  if (!queue.length) return;
  if (playMode === 'recommend') queueIndex = await recommendIndex(current || {});
  else queueIndex = (queueIndex + 1) % queue.length;
  await playQueueIndex();
}

setMode(playMode);

async function rollDice() {
  setActive('Home');
  const content = document.getElementById('content');
  content.innerHTML = '<h1 class="section-title">Rolling...</h1>';
  const lists = (await fetchJSON('/api/playlists')).filter(list => list.count > 0);
  if (!lists.length) {
    content.innerHTML = '<h1 class="section-title">Nothing to roll yet</h1>';
    return;
  }
  const pick = lists[Math.floor(Math.random() * lists.length)];
  const data = await fetchJSON('/api/playlists/' + encodeURIComponent(pick.name));
  loadedTracks = dedupeTracks(data.tracks || []);
  let html = `<button class="dice-btn" onclick="rollDice()">Roll the dice</button><h1 class="section-title">${attr(pick.name)}</h1><div class="track-list">`;
  loadedTracks.forEach(track => { html += playlistRow(track); });
  html += '</div>';
  content.innerHTML = html;
  await startPlaylist(loadedTracks, Math.floor(Math.random() * loadedTracks.length));
}

function playlistRow(track) {
  return `<div class="track-row" data-play-title="${attr(track.title)}" data-play-artist="${attr(track.artist)}">
    <img class="row-art" alt="" src="${coverURL(track.artist, track.title)}" onerror="this.style.visibility='hidden'">
    <div><div class="title">${attr(track.title || '')}</div><div class="artist">${attr(track.artist || '')}</div></div>
    <div class="album">${attr(track.album || '')}</div>
    <div class="duration">${track.duration_ms ? formatTime(track.duration_ms / 1000) : ''}</div>
    <span>Play</span>
  </div>`;
}

async function showPlaylist(name) {
  setActive('');
  const data = await fetchJSON('/api/playlists/' + encodeURIComponent(name));
  loadedTracks = dedupeTracks(data.tracks || []);
  let html = `<h1 class="section-title">${attr(name)}</h1><div class="track-list">`;
  loadedTracks.forEach(track => { html += playlistRow(track); });
  html += '</div>';
  document.getElementById('content').innerHTML = html || '<p>This playlist is empty.</p>';
}

const originalShowHome = showHome;
showHome = async function () {
  setActive('Home');
  const content = document.getElementById('content');
  content.innerHTML = '<h1 class="section-title">Loading...</h1>';
  try {
    const lists = (await fetchJSON('/api/playlists').catch(() => [])).filter(list => list.count > 0);
    let data = { for_you: [], recently_added: [] };
    try { data = await fetchJSON('/api/recommendations'); } catch (err) { /* library can be empty */ }
    let html = '<button class="dice-btn" onclick="rollDice()">Roll the dice</button> <button class="dice-btn" onclick="openMediaBrowser()">Media server</button>';
    if (lists.length) {
      html += '<h1 class="section-title">Your playlists</h1><div class="playlist-grid">';
      lists.forEach(list => {
        html += `<div class="card" onclick="showPlaylist('${escape(list.name)}')"><div class="card-img"><img alt="" src="${coverURL(list.sample_artist, list.sample_title)}" onerror="this.style.display='none'"></div><h3>${attr(list.name)}</h3><p>${list.count} tracks</p></div>`;
      });
      html += '</div>';
    }
    html += '<h1 class="section-title">Made for you</h1><div class="carousel">';
    (data.for_you || []).slice(0, 10).forEach(track => { html += cardHTML(track); });
    if (!(data.for_you || []).length) html += '<p style="color:var(--text-sub)">No audio files yet. Use Upload Music.</p>';
    html += '</div>';
    document.getElementById('content').innerHTML = html;
    loadGenres();
  } catch (err) {
    content.innerHTML = `<h1 class="section-title">Could not load</h1><p>${err.message}</p>`;
  }
};

showHome();
document.getElementById('main').addEventListener('click', (event) => {
  const row = event.target.closest('.track-list [data-play-title]');
  if (!row) return;
  const title = row.dataset.playTitle;
  const artist = row.dataset.playArtist || '';
  const index = loadedTracks.findIndex(track => track.title === title && (track.artist || '') === artist);
  if (index >= 0) startPlaylist(loadedTracks, index);
  else playByName(title, artist);
});
</script>
